name: 💡 Feature request
description: Suggest something new for mobiCut.
title: "[Feature] "
labels: ["enhancement", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Please look at the [existing requests, most wanted first](https://github.com/bme327/mobicut-public/issues?q=is%3Aissue+label%3Aenhancement+sort%3Areactions-%2B1-desc). If your idea is already there, **vote for it with 👍** instead of opening a new one.

        Every request starts as **New**. After a look it becomes **Accepted** (planned) or **Rejected** (with the reason in a comment), and **Closed** once it's released.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like mobiCut to do, and why? What would it help you with?
      placeholder: When I film a whole flight, I'd like to …
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Examples from other apps, sketches, screenshots.
