name: Issue status

# Keeps exactly one "status: …" label on an issue:
#   status: new       set by the issue templates
#   status: accepted  planned; the issue stays open
#   status: rejected  closed as "not planned"; the reason goes in a comment before labelling
#   status: closed    fixed / done and released; closed as "completed"
# Closing an issue with GitHub's own Close button also sets the matching label.
on:
  issues:
    types: [labeled, closed]

permissions:
  issues: write

jobs:
  closed-by-button:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          REASON: ${{ github.event.issue.state_reason }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          want="status: closed"; [ "$REASON" = "not_planned" ] && want="status: rejected"
          echo "$LABELS" | jq -e --arg w "$want" 'index($w)' >/dev/null && exit 0
          gh issue edit "$ISSUE" -R "$REPO" --add-label "$want"
          echo "$LABELS" | jq -r '.[] | select(startswith("status: "))' | while read -r l; do
            gh issue edit "$ISSUE" -R "$REPO" --remove-label "$l"
          done

  status:
    if: github.event.action == 'labeled' && startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          NEW_LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          echo "$LABELS" | jq -r '.[]' | while read -r l; do
            case "$l" in
              "status: "*) [ "$l" = "$NEW_LABEL" ] || gh issue edit "$ISSUE" -R "$REPO" --remove-label "$l" ;;
            esac
          done
          case "$NEW_LABEL" in
            "status: rejected")
              gh issue close "$ISSUE" -R "$REPO" --reason "not planned" ;;
            "status: closed")
              gh issue close "$ISSUE" -R "$REPO" --reason "completed" ;;
            "status: accepted"|"status: new")
              if [ "$(gh issue view "$ISSUE" -R "$REPO" --json state --jq .state)" = "CLOSED" ]; then
                gh issue reopen "$ISSUE" -R "$REPO"
              fi ;;
          esac
