name: Pages build check

# Builds the site on every pull request with the same gems as GitHub Pages (Gemfile:
# github-pages), so Liquid/front matter mistakes show up before merging. Publishes nothing;
# GitHub Pages still builds and deploys main by itself.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        # Errors are re-emitted as annotations, so they can be read without the raw log.
        run: |
          set +e
          bundle exec jekyll build --baseurl /mobicut-public --strict_front_matter 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            grep -iE "error|exception|liquid|warning" build.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            tail -8 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $st
      - name: Every page redirects to bmesoft.eu
        run: |
          cd _site
          fail=0
          for f in $(find . -name index.html); do
            grep -q 'http-equiv="refresh" content="0; url=https://bmesoft.eu/' "$f" && continue
            [ "$f" = ./closed-alpha/cs/index.html ] && grep -q 'http-equiv="refresh"' "$f" && continue  # old link, via /cs/closed-alpha/
            echo "::error::${f#./} doesn't redirect to bmesoft.eu"; fail=1
          done
          grep -q 'url=https://bmesoft.eu/mobicut/docs/"' index.html || { echo "::error::home doesn't redirect to the docs home"; fail=1; }
          grep -q 'url=https://bmesoft.eu/cs/mobicut/docs/speed/"' cs/operations/speed/index.html || { echo "::error::Czech pages don't go to the Czech docs"; fail=1; }
          exit $fail
