title: mobiCut
description: A small video editor for Android. Split, delete, speed up, subtitle and export clips on your phone.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
color_scheme: dark
search_enabled: true
heading_anchors: true
aux_links:
  "Download APK": "https://github.com/bme327/mobicut/releases/latest/download/mobicut.apk"
footer_content: "mobiCut documentation. Screens are illustrations of the app; real screenshots replace them as they are added."

# The latest build of the app. One place to change it if the APK moves.
apk_url: "https://github.com/bme327/mobicut/releases/latest/download/mobicut.apk"
# Build the pages describe (CI run number of the app repo).
app_version: "0.2.16"

exclude:
  - _tools
  - README.md
  - Gemfile
  - Gemfile.lock
