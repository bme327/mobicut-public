title: mobiCut
description: The mobiCut docs moved to https://bmesoft.eu/mobicut/docs/
permalink: pretty
# Every page only redirects to its new address on bmesoft.eu (redirect_to in its front matter).
# Installed apps open https://bme327.github.io/mobicut-public/, so the redirects stay for good.
plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor   # gems installed by the PR build check
  - build.log
