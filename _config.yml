title: mobiCut
permalink: pretty
description: A small video editor for Android. Split, delete, speed up, subtitle and export clips on your phone.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-redirect-from
color_scheme: dark
search_enabled: true
heading_anchors: true
footer_content: "mobiCut documentation. Screens are illustrations of the app; real screenshots replace them as they are added."

# Planned public release on Google Play. There is no public download until then.
release_planned: "mid-November 2026"
release_planned_cs: "v polovině listopadu 2026"
# Release the pages describe (release/<date>.<n> of the app repo).
app_version: "2026-11-03.1"

exclude:
  - _tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor   # gems installed by the PR build check
  - build.log

# Languages: English pages at /x/, Czech twins at /cs/x/ (same path under cs/).
# page.lang picks the sidebar (_includes/components/site_nav.html) and the language switch.
defaults:
  - scope: { path: "" }
    values: { lang: "en" }
  - scope: { path: "cs" }
    values: { lang: "cs" }
