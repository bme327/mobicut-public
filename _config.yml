title: mobiCut
permalink: pretty
description: A small video editor for Android. Split, delete, speed up, subtitle and export clips on your phone.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-redirect-from
color_scheme: dark
search_enabled: true
heading_anchors: true
aux_links:
  "Download APK": "https://github.com/bme327/mobicut-public/releases/latest/download/mobicut.apk"
aux_links_cs:
  "Stáhnout APK": "https://github.com/bme327/mobicut-public/releases/latest/download/mobicut.apk"
footer_content: "mobiCut documentation. Screens are illustrations of the app; real screenshots replace them as they are added."

# The latest build of the app. One place to change it if the APK moves.
apk_url: "https://github.com/bme327/mobicut-public/releases/latest/download/mobicut.apk"
# Release the pages describe (release/<date>.<n> of the app repo).
app_version: "2026-10-22.1"

exclude:
  - _tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor   # gems installed by the PR build check
  - build.log

# Languages: English pages at /x/, Czech twins at /cs/x/ (same path under cs/).
# page.lang picks the sidebar (_includes/components/site_nav.html) and the language switch.
defaults:
  - scope: { path: "" }
    values: { lang: "en" }
  - scope: { path: "cs" }
    values: { lang: "cs" }
